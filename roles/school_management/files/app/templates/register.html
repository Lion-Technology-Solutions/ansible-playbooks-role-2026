{% extends 'base.html' %}{% block content %}<section class="panel narrow"><p class="eyebrow">YOUR LIONTECH JOURNEY</p><h1>Create your portal.</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Full name<input name="name" autocomplete="name" maxlength="100" required></label><label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button>Create student portal</button></form><p>Already registered? <a href="{{ url_for('student_login') }}">Student sign in</a></p><p class="muted">Use the same school host whenever you sign in. Each host has its own accounts and records.</p></section>{% endblock %}
