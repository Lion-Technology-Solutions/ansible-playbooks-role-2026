name: Vercel school portal tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portal-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment dependencies
        run: |
          python - <<'PYTHON'
          import subprocess, sys, tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('school-portal/pyproject.toml').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['project']['dependencies'], 'pytest==8.4.2'])
          PYTHON
      - run: pytest school-portal/tests -q
