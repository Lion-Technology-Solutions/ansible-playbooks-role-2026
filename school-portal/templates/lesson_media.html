{% for item in lesson_media(lesson) %}<article class="panel"><h3>{{ item.title }}</h3>{% if item.kind=='youtube' %}<button type="button" class="button blue" data-youtube-src="{{ item.url }}" data-video-title="{{ item.title }}">Load YouTube video</button><p class="muted">Loading connects to YouTube. YouTube videos follow the owner's sharing settings.</p>{% else %}<a class="button outline" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">Open Zoom ↗</a>{% endif %}</article>{% endfor %}
