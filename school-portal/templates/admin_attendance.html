<section class="panel" id="attendance"><h2>Attendance register</h2><div class="table-scroll"><table><thead><tr><th>Student</th><th>Course</th><th>Class</th><th>Submitted (UTC)</th><th>Status</th></tr></thead><tbody>{% for a in attendance %}<tr><td>{{ a.student.name }}</td><td>{{ a.lesson.course.name }}</td><td>{{ a.lesson.title }}</td><td>{{ aware(a.submitted_at).strftime('%Y-%m-%d %H:%M') }}</td><td>Present</td></tr>{% else %}<tr><td colspan="5">No attendance recorded yet.</td></tr>{% endfor %}</tbody></table></div></section>
