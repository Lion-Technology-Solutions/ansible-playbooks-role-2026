<form method="post" action="{{ url_for('preferences') }}" data-language-form class="public-language">{{ token() }}<input type="hidden" name="next" value="{{ current_path }}"><input type="hidden" name="timezone" value="{{ ui_timezone }}"><label><span class="sr-only">{{ t('Language') }}</span><select name="language" aria-label="Language"><option value="en"{% if ui_language=='en' %} selected{% endif %}>English</option><option value="fr"{% if ui_language=='fr' %} selected{% endif %}>Français</option></select></label><noscript><button>{{ t('Save') }}</button></noscript></form>
