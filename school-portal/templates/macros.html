{% macro token() %}<input type="hidden" name="csrf" value="{{ csrf }}">{% endmacro %}
{% macro course_select(courses) %}<label>Course<select name="course_id" required>{% for course in courses %}<option value="{{ course.id }}">{{ course.name }}</option>{% endfor %}</select></label>{% endmacro %}
{% macro external(url, label, style='') %}<a class="button {{ style }}" href="{{ url }}" target="_blank" rel="noopener noreferrer">{{ label }} <span aria-hidden="true">↗</span></a>{% endmacro %}
