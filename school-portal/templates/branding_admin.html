<section class="panel" id="branding"><p class="eyebrow">BRANDING &amp; IMAGES</p><h2>Make the portal your own.</h2><p>Upload logo and banner images in the <a href="{{ url_for('file_library') }}">file library</a> using “Branding images”, then select them here. Selected images appear publicly.</p>
<form method="post">{{ token() }}<input type="hidden" name="action" value="branding"><label>Academy / portal name<input name="site_name" maxlength="100" value="{{ branding.site_name }}" required></label><label>Footer tagline<input name="tagline" maxlength="250" value="{{ branding.tagline }}"></label><div class="two-col"><label>Primary colour<input type="color" name="primary_color" value="{{ branding.primary_color }}" required></label><label>Accent colour<input type="color" name="accent_color" value="{{ branding.accent_color }}" required></label></div>
<div class="two-col"><label>Logo<select name="logo_asset_id"><option value="">Default LionTech logo</option>{% for asset in branding_assets %}<option value="{{ asset.id }}"{% if branding.logo_asset_id==asset.id %} selected{% endif %}>{{ asset.title }}</option>{% endfor %}</select></label><label>Homepage banner<select name="banner_asset_id"><option value="">Default homepage illustration</option>{% for asset in branding_assets %}<option value="{{ asset.id }}"{% if branding.banner_asset_id==asset.id %} selected{% endif %}>{{ asset.title }}</option>{% endfor %}</select></label></div><button class="button blue">Save &amp; publish branding</button></form></section>
