<div class="social-buttons">{% for provider,label in [('google','Google'),('facebook','Facebook')] %}{% if social_available(provider) %}<form method="post" action="{{ url_for('social_start',provider=provider) }}">{{ token() }}<button class="button {{ 'facebook-button' if provider=='facebook' else 'outline' }} full"><span aria-hidden="true">{{ 'G' if provider=='google' else 'f' }}</span>Continue with {{ label }}</button></form>{% endif %}{% endfor %}</div>
