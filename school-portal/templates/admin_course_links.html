<section class="panel"><h2>Course registration &amp; resource links</h2>{% for c in courses %}<details><summary>{{ c.name }}</summary><form method="post"><input type="hidden" name="return_view" value="programs">{{ token() }}<input type="hidden" name="action" value="course_links"><input type="hidden" name="course_id" value="{{ c.id }}"><label>Zoom class registration link<input type="url" name="registration_url" maxlength="3000" value="{{ c.registration_url }}"></label><label>Course resources link<input type="url" name="resources_url" maxlength="3000" value="{{ c.resources_url }}"></label><button class="button blue">Save course links</button></form></details>{% endfor %}</section>
