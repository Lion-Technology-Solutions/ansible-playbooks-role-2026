<form class="dashboard-filters" method="get"><input type="hidden" name="view" value="{{ admin_view }}"><label><span class="sr-only">Program filter</span><select name="program"><option value="">{{ t('All programs') }}</option>{% for course in courses %}<option value="{{ course.id }}"{% if overview.program==course.id|string %} selected{% endif %}>{{ course.name }}</option>{% endfor %}</select></label><label><span class="sr-only">Country filter</span><select name="country"><option value="">{{ t('All countries') }}</option>{% for country in countries %}<option{% if overview.country==country %} selected{% endif %}>{{ country }}</option>{% endfor %}</select></label><label><span class="sr-only">Enrollment creation year</span><select name="year"><option value="">{{ t('All time') }}</option>{% for year in [2026,2027,2028] %}<option value="{{ year }}"{% if overview.year==year|string %} selected{% endif %}>Created in {{ year }}</option>{% endfor %}</select></label><label><span class="sr-only">Recorded revenue currency</span><select name="currency">{% for currency in currencies %}<option{% if overview.currency==currency %} selected{% endif %}>{{ currency }}</option>{% endfor %}</select></label><button class="button blue" type="submit">{{ t('Apply filters') }}</button></form>
