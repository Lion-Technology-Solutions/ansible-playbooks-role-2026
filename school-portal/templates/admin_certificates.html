<section class="dash-card"><h2>Completion certificates</h2><p>Issue only after reviewing a paid student’s completion of all released lessons.</p><form method="post">{{ token() }}<input type="hidden" name="action" value="issue_certificate"><input type="hidden" name="return_view" value="students"><label>Student enrollment<select name="enrollment_id" required>{% for e in enrollments %}<option value="{{ e.id }}">{{ e.student.name }} · {{ e.course.name }}</option>{% endfor %}</select></label><button class="button blue"{% if not enrollments %} disabled{% endif %}>Review eligibility &amp; issue certificate</button></form>{% for certificate in certificates %}<p><a href="{{ url_for('certificate_page',certificate_id=certificate.id) }}">{{ certificate.student.name }} · {{ certificate.course.name }} →</a></p>{% endfor %}</section>
